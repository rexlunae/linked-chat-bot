[package]
name = "linked-chat-bot"
version = "0.1.0"
edition = "2021"
description = "A CLI tool to automatically respond to LinkedIn recruiters and schedule interviews"
authors = []
license = "MIT"

[dependencies]
# Async runtime
tokio = { version = "1.42", features = ["full"] }

# HTTP client
reqwest = { version = "0.12", features = ["json", "cookies"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# CLI parsing
clap = { version = "4.5", features = ["derive", "env"] }

# Date/time handling
chrono = { version = "0.4", features = ["serde"] }

# Error handling
anyhow = "1.0"
thiserror = "2.0"

# Configuration
dotenv = "0.15"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# OpenAI integration for AI responses
async-openai = "0.27"

# Browser automation for LinkedIn
headless_chrome = "1.0"

# Google Calendar API
google-calendar3 = "6.0"

# Utilities
uuid = { version = "1.11", features = ["v4"] }
regex = "1.11"
url = "2.5"

[dev-dependencies]
mockall = "0.13"
tokio-test = "0.4"
